{% load crispy_forms_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hotel Management{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/favicon.ico' %}">


    {% block extrastyle %}{% endblock %}
</head>
    <!-- Bootstrap Bundle JS -->
    {% comment %} <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> {% endcomment %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
<body>
    {% include 'header.html' %}
    
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'footer.html' %}
    <!-- jQuery -->
    
    {% block extrajs %}{% endblock %}
    
    <script>
    
    $(document).ajaxError(function (event, xhr) {
        if (xhr.status === 403) {
            Swal.fire({
                icon: "error",
                title: "Permission Denied",
                text: xhr.responseJSON?.message || "You are not allowed to do this"
            });
        }
    });
    </script>
</body>
</html>
