{%extends 'base.html'%}
{%block content%}
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tableslists" class="table table-hover table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Table</th>
                                    <th>Time_Schedule</th>
                                    <th>Start_Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%endblock%}
{%block extrajs%}
    <script>
        $(document).ready(function(){
            $('#tableslists').DataTable({
                serverSide: true,
                processing:true,
                ajax:{url:"/admin_report/table-list-data/",type:"GET"},
                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                columns:[
                    {data:'pk',name:'pk',orderable:true,searchable:true},
                    {data:'table',name:'table',orderable:true,searchable:true},
                    {data:'time_schedule',name:'time_schedule',orderable:true,searchable:true},
                    {data:'start_time',name:'start_time',orderable:true,searchable:true},
                    {data:'status',name:'status',orderable:true,searchable:true}
                ]
            })
        })
    </script>
{%endblock%}
