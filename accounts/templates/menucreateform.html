{% load crispy_forms_tags %}
<form method="post" id="menu_form" enctype="multipart/form-data" action="{% if form.instance.pk %}
                {% url 'accounts:menuupdate' form.instance.pk %}
              {% else %}
                {% url 'accounts:menucreate' %}
              {% endif %}">
    {% csrf_token %}
    {{form|crispy}}
    <button class="btn btn-primary" type="submit">Submit</button>
</form>
