[project]
name = "hotel-management"
version = "0.1.0"
description = ""
authors = [
    {name = "Jas2005-ct",email = "jaswantjas02@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "django (>=5.0,<6.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "django-crispy-forms (>=2.5,<3.0)",
    "crispy-bootstrap5 (>=2025.6,<2026.0)",
    "django-debug-toolbar (>=6.1.0,<7.0.0)",
    "celery (>=5.6.0,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "django-celery-results (>=2.6.0,<3.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "django-ajax-datatable (>=4.5.0,<5.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "ipython (>=9.8.0,<10.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "boto3 (>=1.43.67,<2.0.0)"
]

[tool.poetry]
packages = [{include = "hotel_management", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


