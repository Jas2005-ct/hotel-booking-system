{% comment %} {% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <h2 class="mb-0 fw-bold"><i class="bi bi-cart me-2"></i>Order Food</h2>
            </div>
            <div class="card-body p-4 p-md-5">
                <h5 class="card-title text-center text-muted mb-4">Enter the Order Details</h5>
                <form action="" method="post" class="needs-validation">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary btn-lg shadow-sm" type="submit">
                            Submit
                        </button>
                        <a href="#" class="btn btn-outline-secondary btn-sm mt-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %} {% endcomment %}
{% load crispy_forms_tags %}
<div class="modal fade" id="checkoutModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="orderForm" method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success w-100" type="submit">
          Confirm Order
        </button>
      </form>
    </div>
  </div>
</div>
