{% load crispy_forms_tags %}

<div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title fw-bold" id="checkoutModalLabel">
                    <i class="bi bi-cart-check me-2"></i>Complete Your Order
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="orderForm" method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary btn-lg rounded-pill shadow-sm" type="submit">
                            <i class="bi bi-check-lg me-2"></i>Confirm Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
